[package]
name = "llika-cli"
version.workspace = true
edition.workspace = true
description = "Command-line front end for llika-core."

# The binary is `llika`, which is the invocation the spec's §1 observable names.
[[bin]]
name = "llika"
path = "src/main.rs"

[dependencies]
llika-core = { path = "../llika-core" }
clap = { version = "4", features = ["derive"] }
